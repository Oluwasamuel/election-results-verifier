<!doctype html>

  <head>
    <script>
      // Suppress unhandled rejections / errors originating from browser extensions
      // (e.g. MetaMask / Web3 inpage injections) so they don't surface as app errors.
      (function () {
        var isExtensionError = function (value) {
          try {
            var msg =
              typeof value === "string"
                ? value
                : (value && (value.message || value.reason)) || "";
            var stack = (value && value.stack) || "";
            var src = (value && value.filename) || "";
            var text = String(msg) + " " + String(stack) + " " + String(src);
            return /chrome-extension:\/\/|moz-extension:\/\/|safari-extension:\/\/|extension:\/\/|MetaMask|metamask|inpage\.js|web3|ethereum/i.test(
              text,
            );
          } catch (e) {
            return false;
          }
        };
        window.addEventListener(
          "unhandledrejection",
          function (event) {
            if (isExtensionError(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
        window.addEventListener(
          "error",
          function (event) {
            var err = event.error || event.message || "";
            if (isExtensionError(err) || isExtensionError(event.filename)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
      })();
    </script>
